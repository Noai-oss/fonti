version: 2
updates:
  - package-ecosystem: "uv"
    assignees:
      - "Noai-oss"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps): "
    groups:
      python-packages:
        dependency-type: "development"
        patterns:
          - "*"
